<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON COMMAND - Tactical Strategy</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --grid-line: #1e293b;
            --neon-green: #00ff9d;
            --neon-red: #ff0055;
            --neon-yellow: #ffd700;
            --neon-cyan: #00ffff;
            --text-main: #e2e8f0;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Resources */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--grid-line);
            z-index: 10;
        }

        .resources {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .res-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-energy { color: var(--neon-cyan); }
        .icon-materials { color: var(--neon-yellow); }
        .icon-units { color: var(--neon-green); }

        .game-info {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Main Game Area */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: auto;
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            width: min(90vw, 600px);
            height: min(90vw, 600px);
            background: #0f172a;
            border: 2px solid var(--grid-line);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .cell {
            border: 1px solid var(--grid-line);
            position: relative;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        .cell:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .cell.selected {
            background: rgba(0, 255, 255, 0.3);
            border: 1px solid var(--neon-cyan);
        }

        /* Entities in Cells */
        .entity {
            width: 80%;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-size: 1.2rem;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .building { background: rgba(0, 255, 157, 0.2); border: 1px solid var(--neon-green); }
        .unit { background: rgba(0, 255, 157, 0.4); border: 1px solid var(--neon-green); }
        .enemy { background: rgba(255, 0, 85, 0.4); border: 1px solid var(--neon-red); }
        .base { background: var(--neon-cyan); color: black; font-weight: bold; }

        /* Action Panel */
        footer {
            background: var(--panel-bg);
            border-top: 1px solid var(--grid-line);
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #1e293b;
            border: 1px solid var(--grid-line);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--neon-cyan);
            background: #334155;
        }

        .action-btn.active {
            border-color: var(--neon-green);
            background: rgba(0, 255, 157, 0.2);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-cost {
            font-size: 0.7rem;
            color: var(--neon-yellow);
            margin-top: 2px;
        }

        /* Mute Button */
        #mute-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--grid-line);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
        }

        /* Damage Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -2px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.5s;
        }

        /* Floating Text */
        .float-text {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        /* Modal / Game Over */
        #modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border: 2px solid var(--neon-red);
            text-align: center;
            border-radius: 8px;
        }

        .modal-content h2 { color: var(--neon-red); margin-bottom: 15px; }
        .modal-content button {
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--neon-cyan);
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .resources { font-size: 1rem; gap: 10px; }
            .action-btn { min-width: 50px; padding: 5px; font-size: 0.8rem; }
            #game-grid { width: 95vw; height: 95vw; }
        }
    </style>
</head>
<body>

    <header>
        <div class="resources">
            <div class="res-item"><span class="icon-energy">⚡</span> <span id="res-energy">0</span></div>
            <div class="res-item"><span class="icon-materials">🔧</span> <span id="res-materials">0</span></div>
            <div class="res-item"><span class="icon-units">👥</span> <span id="res-units">0/100</span></div>
        </div>
        <div class="game-info">
            <span>Wave: <strong id="wave-num">1</strong></span>
            <span>HP Base: <strong id="base-hp">100</strong>%</span>
        </div>
    </header>

    <button id="mute-btn">🔊 Sound On</button>

    <main>
        <div id="game-grid"></div>
    </main>

    <footer>
        <button class="action-btn" data-type="mine" title="Mine: Generates Energy">
            ⛏️ Mine
            <span class="btn-cost">🔧 50</span>
        </button>
        <button class="action-btn" data-type="barracks" title="Barracks: Trains Units">
            🏠 Barracks
            <span class="btn-cost">🔧 100 ⚡ 50</span>
        </button>
        <button class="action-btn" data-type="tower" title="Tower: Auto Attack">
            🗼 Tower
            <span class="btn-cost">🔧 80 ⚡ 30</span>
        </button>
        <button class="action-btn" data-type="wall" title="Wall: Blocks Enemies">
            🧱 Wall
            <span class="btn-cost">🔧 20</span>
        </button>
        <button class="action-btn" data-type="soldier" title="Train Soldier">
            👤 Soldier
            <span class="btn-cost">⚡ 20 🔧 10</span>
        </button>
        <button class="action-btn" data-type="archer" title="Train Archer">
            🏹 Archer
            <span class="btn-cost">⚡ 30 🔧 15</span>
        </button>
        <button class="action-btn" data-type="tank" title="Train Tank">
            🛡️ Tank
            <span class="btn-cost">⚡ 50 🔧 30</span>
        </button>
    </footer>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">GAME OVER</h2>
            <p id="modal-desc">Your base was destroyed.</p>
            <button onclick="location.reload()">Restart</button>
        </div>
    </div>

    <script>
        /**
         * NEON COMMAND - Single File Tactical Strategy
         * Author: AI Assistant
         * Date: 2026-11-02
         */

        // --- CONFIGURATION ---
        const GRID_SIZE = 12;
        const MAX_UNITS = 100;
        const TICK_RATE = 1000; // 1 second game tick
        const SAVE_INTERVAL = 5000; // Save every 5 seconds

        // Building Costs & Stats
        const BUILDINGS = {
            mine: { cost: { mat: 50 }, income: { energy: 2 }, icon: '⛏️', type: 'building' },
            barracks: { cost: { mat: 100, energy: 50 }, unitCap: 5, icon: '🏠', type: 'building' },
            tower: { cost: { mat: 80, energy: 30 }, damage: 10, range: 2, icon: '🗼', type: 'building' },
            wall: { cost: { mat: 20 }, hp: 50, icon: '🧱', type: 'building' }
        };

        // Unit Stats
        const UNITS = {
            soldier: { cost: { energy: 20, mat: 10 }, hp: 30, dmg: 5, speed: 1, icon: '👤', type: 'unit' },
            archer: { cost: { energy: 30, mat: 15 }, hp: 20, dmg: 8, speed: 1, range: 3, icon: '🏹', type: 'unit' },
            tank: { cost: { energy: 50, mat: 30 }, hp: 100, dmg: 15, speed: 0.5, icon: '🛡️', type: 'unit' }
        };

        // Enemy Stats
        const ENEMY_TYPES = [
            { name: 'Scout', hp: 20, dmg: 5, speed: 1, icon: '👾', reward: { energy: 5, mat: 2 } },
            { name: 'Brute', hp: 50, dmg: 10, speed: 0.5, icon: '💀', reward: { energy: 10, mat: 5 } },
            { name: 'Boss', hp: 200, dmg: 20, speed: 0.3, icon: '🐉', reward: { energy: 50, mat: 20 } }
        ];

        // --- STATE ---
        let state = {
            resources: { energy: 100, materials: 100 },
            unitsCount: 0,
            wave: 1,
            baseHP: 100,
            grid: Array(GRID_SIZE * GRID_SIZE).fill(null), // Each cell stores object or null
            enemies: [], // List of enemy objects with pos and stats
            gameOver: false,
            selectedAction: null // 'mine', 'barracks', etc.
        };

        // Load from localStorage
        function loadGame() {
            const saved = localStorage.getItem('neonCommandSave');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Merge basic state, reset transient things like enemies list for simplicity on load
                    state.resources = parsed.resources || state.resources;
                    state.wave = parsed.wave || 1;
                    state.baseHP = parsed.baseHP || 100;
                    state.grid = parsed.grid || state.grid;
                    
                    // Recalculate unit count from grid
                    state.unitsCount = state.grid.filter(cell => cell && cell.type === 'unit').length;
                    
                    renderGrid();
                    updateUI();
                    log("Game loaded from save.");
                } catch (e) {
                    console.error("Save corrupted", e);
                    initNewGame();
                }
            } else {
                initNewGame();
            }
        }

        function initNewGame() {
            // Place Base at center
            const centerIdx = Math.floor((GRID_SIZE * GRID_SIZE) / 2);
            state.grid[centerIdx] = { type: 'base', icon: '🏰', hp: 100 };
            
            // Initial resources
            state.resources.energy = 100;
            state.resources.materials = 100;
            
            renderGrid();
            updateUI();
            startMusic();
            log("New Game Started");
        }

        function saveGame() {
            if (state.gameOver) return;
            const saveData = {
                resources: state.resources,
                wave: state.wave,
                baseHP: state.baseHP,
                grid: state.grid.map(cell => {
                    if (!cell) return null;
                    // Don't save complex runtime props if possible, but here we keep it simple
                    return { type: cell.type, icon: cell.icon, hp: cell.hp }; 
                })
            };
            localStorage.setItem('neonCommandSave', JSON.stringify(saveData));
        }

        setInterval(saveGame, SAVE_INTERVAL);

        // --- AUDIO ENGINE (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;
        let musicInterval;
        let bassStep = 0;

        // Simple 8-bit synth helper
        function playTone(freq, type, duration, volume = 0.1) {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playNoise(duration, volume = 0.1) {
            if (isMuted) return;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        }

        // Music Sequencer
        const bassNotes = [110, 110, 130.81, 130.81]; // A2, A2, C3, C3 approx
        const arpNotes = [220, 261.63, 329.63, 261.63]; // A3, C4, E4, C4
        
        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            let step = 0;
            musicInterval = setInterval(() => {
                if (isMuted || state.gameOver) return;
                
                // Bass Line (Every 2 steps)
                if (step % 2 === 0) {
                    playTone(bassNotes[bassStep], 'square', 0.2, 0.15);
                    bassStep = (bassStep + 1) % bassNotes.length;
                }
                
                // Arpeggio (Every step)
                playTone(arpNotes[step % arpNotes.length], 'triangle', 0.1, 0.05);
                
                // Rhythm (Kick on 0, Snare on 2)
                if (step % 4 === 0) playNoise(0.1, 0.2); // Kick-like noise burst
                if (step % 4 === 2) playNoise(0.05, 0.1); // Snare-like
                
                step++;
            }, 200); // Fast tempo
        }

        // SFX
        const sfx = {
            build: () => playTone(150, 'sawtooth', 0.3, 0.2), // Low Boom
            resource: () => playTone(800, 'sine', 0.1, 0.1), // Ding
            attack: () => playNoise(0.1, 0.3), // Sharp Hit
            death: () => { playTone(200, 'square', 0.2, 0.2); setTimeout(()=>playTone(100, 'square', 0.2, 0.2), 100); },
            error: () => playTone(100, 'square', 0.2, 0.2)
        };

        document.getElementById('mute-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = isMuted ? "🔇 Sound Off" : "🔊 Sound On";
            if (!isMuted && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        // --- GAME LOGIC ---

        function getCellIndex(x, y) {
            return y * GRID_SIZE + x;
        }

        function getCoordsFromIndex(index) {
            return {
                x: index % GRID_SIZE,
                y: Math.floor(index / GRID_SIZE)
            };
        }

        function canAfford(cost) {
            return state.resources.energy >= (cost.energy || 0) && 
                   state.resources.materials >= (cost.mat || 0);
        }

        function spendResources(cost) {
            state.resources.energy -= (cost.energy || 0);
            state.resources.materials -= (cost.mat || 0);
            updateUI();
        }

        function addFloatingText(text, color, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.color = color;
            // Approximate pixel position based on grid layout
            // This is a visual approximation for the demo
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function placeBuilding(type, index) {
            if (state.gameOver) return;
            
            const def = BUILDINGS[type];
            if (!def) return;

            if (state.grid[index] !== null) {
                sfx.error();
                return;
            }

            if (!canAfford(def.cost)) {
                sfx.error();
                return;
            }

            spendResources(def.cost);
            state.grid[index] = { ...def, type: type, hp: def.hp || 100 };
            
            sfx.build();
            renderGrid();
            saveGame();
        }

        function trainUnit(type, index) {
            if (state.gameOver) return;
            
            const def = UNITS[type];
            if (!def) return;

            // Must click on a Barracks
            const building = state.grid[index];
            if (!building || building.type !== 'barracks') {
                sfx.error();
                return;
            }

            if (state.unitsCount >= MAX_UNITS) {
                sfx.error();
                return;
            }

            if (!canAfford(def.cost)) {
                sfx.error();
                return;
            }

            spendResources(def.cost);
            
            // Find empty adjacent cell for unit spawn
            const coords = getCoordsFromIndex(index);
            let spawned = false;
            const directions = [[0,-1],[1,0],[0,1],[-1,0]];
            
            for (let dir of directions) {
                const nx = coords.x + dir[0];
                const ny = coords.y + dir[1];
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                    const nIdx = getCellIndex(nx, ny);
                    if (state.grid[nIdx] === null) {
                        state.grid[nIdx] = { ...def, type: 'unit', currentHp: def.hp };
                        state.unitsCount++;
                        spawned = true;
                        break;
                    }
                }
            }

            if (spawned) {
                sfx.resource();
                renderGrid();
                updateUI();
            } else {
                sfx.error();
            }
        }

        function handleCellClick(index) {
            if (state.gameOver) return;
            
            // If an action is selected, try to perform it
            if (state.selectedAction) {
                if (BUILDINGS[state.selectedAction]) {
                    placeBuilding(state.selectedAction, index);
                } else if (UNITS[state.selectedAction]) {
                    trainUnit(state.selectedAction, index);
                }
                // Deselect after action? No, keep selected for multiple builds usually, 
                // but for clarity let's deselect if invalid or just keep it active.
                // Let's keep it active for rapid placement.
            } else {
                // Just highlight/select logic could go here
            }
        }

        // --- RENDERING ---

        function renderGrid() {
            const gridEl = document.getElementById('game-grid');
            gridEl.innerHTML = '';
            
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                
                const entity = state.grid[i];
                if (entity) {
                    const entDiv = document.createElement('div');
                    entDiv.className = `entity ${entity.type}`;
                    entDiv.innerText = entity.icon;
                    
                    // Visual HP indicator via opacity or border color could be added here
                    if (entity.currentHp && entity.maxHp) {
                         // Simple visual cue for damaged units
                         if(entity.currentHp < entity.maxHp * 0.5) entDiv.style.opacity = '0.7';
                    }
                    
                    cell.appendChild(entDiv);
                }
                
                cell.addEventListener('click', () => handleCellClick(i));
                gridEl.appendChild(cell);
            }
        }

        function updateUI() {
            document.getElementById('res-energy').innerText = Math.floor(state.resources.energy);
            document.getElementById('res-materials').innerText = Math.floor(state.resources.materials);
            document.getElementById('res-units').innerText = `${state.unitsCount}/${MAX_UNITS}`;
            document.getElementById('wave-num').innerText = state.wave;
            document.getElementById('base-hp').innerText = state.baseHP;
            
            // Update button states
            document.querySelectorAll('.action-btn').forEach(btn => {
                const type = btn.dataset.type;
                let cost = {};
                if (BUILDINGS[type]) cost = BUILDINGS[type].cost;
                if (UNITS[type]) cost = UNITS[type].cost;
                
                btn.disabled = !canAfford(cost);
                
                if (state.selectedAction === type) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // --- GAME LOOP ---

        function gameTick() {
            if (state.gameOver) return;

            // 1. Income Generation
            let energyGain = 0;
            let matGain = 0;
            
            state.grid.forEach(cell => {
                if (cell && cell.type === 'mine') {
                    energyGain += BUILDINGS.mine.income.energy;
                }
            });
            
            // Passive material gain from base? Or just mines give both? 
            // Spec said Mine gives income. Let's say Mine gives Energy, Base gives small Materials.
            state.resources.energy += energyGain;
            state.resources.materials += 1; // Small trickle
            
            if (energyGain > 0) sfx.resource(); // Only if gained something significant? Maybe too noisy. 
            // Let's only play sound if we manually collect or big event. 
            // For passive, maybe skip sound to avoid spam.

            // 2. Enemy Waves
            // Spawn enemies every few ticks depending on wave
            if (Math.random() < 0.1 + (state.wave * 0.02)) {
                spawnEnemy();
            }

            // Move Enemies towards Base
            moveEnemies();

            // Towers Attack
            processTowerAttacks();

            // Combat Resolution (Units vs Enemies)
            resolveCombat();

            // Check Win/Loss
            checkGameOver();

            updateUI();
        }

        function spawnEnemy() {
            // Spawn at edges
            const edge = Math.floor(Math.random() * 4);
            let x, y;
            if (edge === 0) { x = Math.floor(Math.random()*GRID_SIZE); y = 0; }
            else if (edge === 1) { x = GRID_SIZE-1; y = Math.floor(Math.random()*GRID_SIZE); }
            else if (edge === 2) { x = Math.floor(Math.random()*GRID_SIZE); y = GRID_SIZE-1; }
            else { x = 0; y = Math.floor(Math.random()*GRID_SIZE); }

            const idx = getCellIndex(x, y);
            if (state.grid[idx] !== null) return; // Blocked by building/unit

            // Choose enemy type based on wave
            let typeIdx = 0;
            if (state.wave > 5) typeIdx = 1;
            if (state.wave > 10 && Math.random() > 0.8) typeIdx = 2;
            
            const template = ENEMY_TYPES[typeIdx];
            
            state.enemies.push({
                id: Date.now() + Math.random(),
                x: x,
                y: y,
                hp: template.hp,
                maxHp: template.hp,
                dmg: template.dmg,
                speed: template.speed,
                icon: template.icon,
                reward: template.reward
            });
            
            // Render enemy visually in grid temporarily? 
            // Better: Keep enemies in separate list and render overlay or inject into grid cells dynamically.
            // For this single-file simplicity, let's inject them into the grid array as temporary entities.
            state.grid[idx] = { type: 'enemy', icon: template.icon, refId: state.enemies.length - 1 };
            renderGrid();
        }

        function moveEnemies() {
            const baseIdx = state.grid.findIndex(c => c && c.type === 'base');
            const baseCoords = getCoordsFromIndex(baseIdx);

            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const enemy = state.enemies[i];
                
                // Find path to base (Simple greedy movement)
                const dx = baseCoords.x - enemy.x;
                const dy = baseCoords.y - enemy.y;
                
                // Try to move closer
                let moved = false;
                let nextX = enemy.x;
                let nextY = enemy.y;

                if (Math.abs(dx) > Math.abs(dy)) {
                    nextX += Math.sign(dx);
                } else {
                    nextY += Math.sign(dy);
                }

                const nextIdx = getCellIndex(nextX, nextY);
                
                // Bounds check
                if (nextX >= 0 && nextX < GRID_SIZE && nextY >= 0 && nextY < GRID_SIZE) {
                    const targetCell = state.grid[nextIdx];
                    
                    if (targetCell === null) {
                        // Move freely
                        state.grid[getCellIndex(enemy.x, enemy.y)] = null;
                        enemy.x = nextX;
                        enemy.y = nextY;
                        state.grid[nextIdx] = { type: 'enemy', icon: enemy.icon, refId: i };
                        moved = true;
                    } else if (targetCell.type === 'unit' || targetCell.type === 'building') {
                        // Attack instead of moving
                        attackTarget(enemy, targetCell, nextIdx);
                    } else if (targetCell.type === 'base') {
                        // Attack Base
                        state.baseHP -= enemy.dmg;
                        sfx.attack();
                        document.querySelector('#game-grid').classList.add('shake');
                        setTimeout(() => document.querySelector('#game-grid').classList.remove('shake'), 500);
                        
                        // Enemy dies after attacking base? Or stays? Usually stays until killed.
                        // Let's make them stay to block.
                    }
                }
            }
            renderGrid();
        }

        function attackTarget(attacker, target, targetIdx) {
            // Simplified combat: Enemy deals damage to target
            if (target.type === 'building') {
                target.hp -= attacker.dmg;
                if (target.hp <= 0) {
                    state.grid[targetIdx] = null;
                    sfx.death();
                }
            } else if (target.type === 'unit') {
                target.currentHp -= attacker.dmg;
                if (target.currentHp <= 0) {
                    state.grid[targetIdx] = null;
                    state.unitsCount--;
                    sfx.death();
                }
            }
        }

        function processTowerAttacks() {
            state.grid.forEach((cell, idx) => {
                if (cell && cell.type === 'tower') {
                    const tCoords = getCoordsFromIndex(idx);
                    // Find nearest enemy within range
                    let nearestDist = Infinity;
                    let nearestEnemyIdx = -1;
                    let nearestEnemyObj = null;

                    state.enemies.forEach((enemy, eIdx) => {
                        const dist = Math.abs(tCoords.x - enemy.x) + Math.abs(tCoords.y - enemy.y);
                        if (dist <= BUILDINGS.tower.range && dist < nearestDist) {
                            nearestDist = dist;
                            nearestEnemyIdx = eIdx;
                            nearestEnemyObj = enemy;
                        }
                    });

                    if (nearestEnemyObj) {
                        // Deal damage
                        nearestEnemyObj.hp -= BUILDINGS.tower.damage;
                        sfx.attack();
                        
                        // Visual feedback
                        const enemyCellIdx = getCellIndex(nearestEnemyObj.x, nearestEnemyObj.y);
                        if (state.grid[enemyCellIdx]) {
                             // Flash red
                        }

                        if (nearestEnemyObj.hp <= 0) {
                            // Kill enemy
                            state.grid[enemyCellIdx] = null;
                            state.enemies.splice(nearestEnemyIdx, 1);
                            sfx.death();
                            
                            // Reward
                            state.resources.energy += nearestEnemyObj.reward.energy;
                            state.resources.materials += nearestEnemyObj.reward.mat;
                        }
                    }
                }
            });
            renderGrid();
        }

        function resolveCombat() {
            // Units attack nearby enemies automatically
            state.grid.forEach((cell, idx) => {
                if (cell && cell.type === 'unit') {
                    const uCoords = getCoordsFromIndex(idx);
                    const range = UNITS[cell.unitType || 'soldier'].range || 1; // Default melee
                    
                    // Find enemy in range
                    for (let i = state.enemies.length - 1; i >= 0; i--) {
                        const enemy = state.enemies[i];
                        const dist = Math.abs(uCoords.x - enemy.x) + Math.abs(uCoords.y - enemy.y);
                        
                        if (dist <= range) {
                            enemy.hp -= cell.dmg;
                            sfx.attack();
                            
                            if (enemy.hp <= 0) {
                                const enemyCellIdx = getCellIndex(enemy.x, enemy.y);
                                state.grid[enemyCellIdx] = null;
                                state.enemies.splice(i, 1);
                                sfx.death();
                                
                                state.resources.energy += enemy.reward.energy;
                                state.resources.materials += enemy.reward.mat;
                                break; // Unit attacks one per tick
                            }
                        }
                    }
                }
            });
        }

        function checkGameOver() {
            if (state.baseHP <= 0) {
                state.gameOver = true;
                document.getElementById('modal-title').innerText = "DEFEAT";
                document.getElementById('modal-desc').innerText = "The base has been destroyed.";
                document.getElementById('modal').style.display = 'flex';
                clearInterval(musicInterval);
            }
            
            // Progress Wave if no enemies for a while? 
            // Simple logic: Increase wave every 30 seconds
            if (Date.now() % 30000 < 1000) { // Rough check
                 state.wave++;
                 log(`Wave ${state.wave} incoming!`);
            }
        }

        function log(msg) {
            console.log(msg);
        }

        // --- INPUT HANDLING ---

        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                if (state.selectedAction === type) {
                    state.selectedAction = null; // Toggle off
                } else {
                    state.selectedAction = type;
                }
                updateUI();
            });
        });

        // Initialize
        loadGame();
        setInterval(gameTick, TICK_RATE);
        
        // Ensure audio context resumes on first interaction (browser policy)
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

    </script>
</body>
